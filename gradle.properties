# ── JVM ──────────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ── AndroidX ─────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true

# ── Kotlin ───────────────────────────────────────────────────────────────────
kotlin.code.style=official

# ── Kiara backend ────────────────────────────────────────────────────────────
# Do NOT set kiara.* values here — they would override local.properties and CI.
# Where the publishable Supabase values come from:
#   • Local dev   → local.properties (gitignored, see local.properties.example)
#   • CI builds   → -Pkiara.supabase.url / -Pkiara.supabase.anonKey (GitHub Secrets)
# The anon/publishable key is public-safe behind RLS; the service_role key NEVER
# enters the app, this repo, or any distributable.
