# ── JVM ──────────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ── AndroidX ─────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true

# ── Kotlin ───────────────────────────────────────────────────────────────────
kotlin.code.style=official

# ── Kiara backend (publishable values only — SAFE to commit) ────────────────
# The anon/publishable key is designed to be public; real security is enforced
# by Row Level Security on the server. NEVER put the service_role key here.
kiara.supabase.url=https://YOUR-PROJECT-REF.supabase.co
kiara.supabase.anonKey=YOUR-PUBLISHABLE-ANON-KEY
