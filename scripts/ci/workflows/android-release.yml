name: Android Release

# Signed release build. Triggers:
#   * push to main that changes app/build.gradle.kts (version bump) or this file
#     → builds, then creates tag v<versionName> + GitHub Release (skipped when
#       that tag already exists, so ordinary edits never re-release)
#   * push a tag v*            → builds and attaches to that tag's release
#   * manual run (workflow_dispatch)
# Required secrets (Repo → Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of your release .jks
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
# Optional (empty → app ships in guest/offline mode):
#   SUPABASE_URL              https://YOUR-PROJECT.supabase.co
#   SUPABASE_ANON_KEY         publishable anon key (public-safe behind RLS)
# Release notes: docs/releases/v<versionName>.md (optional).
# The keystore itself is NEVER committed (.gitignore blocks *.jks / *.keystore).

permissions:
  contents: write   # create tag + GitHub Release, attach APK/AAB

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'app/build.gradle.kts'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          VER=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "branch" ] && git ls-remote --exit-code --tags origin "refs/tags/v$VER" >/dev/null 2>&1; then
            echo "v$VER already released — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.ver.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.ver.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode signing keystore
        if: steps.ver.outputs.skip != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kiaraen-release.jks"

      - name: Build signed release bundle + APK
        if: steps.ver.outputs.skip != 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          gradle :app:bundleRelease :app:assembleRelease --stacktrace
          -Pkiara.signing.storeFile="$RUNNER_TEMP/kiaraen-release.jks"
          -Pkiara.signing.storePassword="$ANDROID_KEYSTORE_PASSWORD"
          -Pkiara.signing.keyAlias="$ANDROID_KEY_ALIAS"
          -Pkiara.signing.keyPassword="$ANDROID_KEY_PASSWORD"
          -Pkiara.supabase.url="${{ secrets.SUPABASE_URL }}"
          -Pkiara.supabase.anonKey="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Clean signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/kiaraen-release.jks"

      - name: Collect release files
        if: steps.ver.outputs.skip != 'true'
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/kiaraen-v$VER.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/kiaraen-v$VER.aab"
          if [ -f "docs/releases/v$VER.md" ]; then
            cp "docs/releases/v$VER.md" dist/notes.md
          else
            echo "Kiaraen v$VER" > dist/notes.md
          fi
          ls -la dist

      - name: Upload artifacts
        if: steps.ver.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kiaraen-release
          path: |
            dist/*.aab
            dist/*.apk

      - name: Publish GitHub Release
        if: steps.ver.outputs.skip != 'true' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Kiaraen v${{ steps.ver.outputs.version }}
          body_path: dist/notes.md
          make_latest: true
          files: |
            dist/*.apk
            dist/*.aab
