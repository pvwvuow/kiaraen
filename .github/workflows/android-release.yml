name: Android Release

# Signed release build. Trigger: push a tag v* or run manually.
# Required secrets (Repo → Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of your release .jks
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
# Optional (empty → app ships in guest/offline mode):
#   SUPABASE_URL              https://YOUR-PROJECT.supabase.co
#   SUPABASE_ANON_KEY         publishable anon key (public-safe behind RLS)
# The keystore itself is NEVER committed (.gitignore blocks *.jks / *.keystore).

permissions:
  contents: write   # tag builds attach APK/AAB to the GitHub Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kiaraen-release.jks"

      - name: Build signed release bundle + APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          gradle :app:bundleRelease :app:assembleRelease --stacktrace
          -Pkiara.signing.storeFile="$RUNNER_TEMP/kiaraen-release.jks"
          -Pkiara.signing.storePassword="$ANDROID_KEYSTORE_PASSWORD"
          -Pkiara.signing.keyAlias="$ANDROID_KEY_ALIAS"
          -Pkiara.signing.keyPassword="$ANDROID_KEY_PASSWORD"
          -Pkiara.supabase.url="${{ secrets.SUPABASE_URL }}"
          -Pkiara.supabase.anonKey="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Clean signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/kiaraen-release.jks"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kiaraen-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
