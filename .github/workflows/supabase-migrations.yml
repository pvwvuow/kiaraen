name: Supabase Migrations

# Applies supabase/migrations/*.sql to the linked project, in filename order.
# Runs on workflow_dispatch (manual) — flip `on: push` once you trust the loop.
# Required secrets:
#   SUPABASE_ACCESS_TOKEN  (supabase.com → Account → Access Tokens)
#   SUPABASE_PROJECT_ID    (project ref, abcdefgh.supabase.co → abcdefgh)
#   SUPABASE_DB_PASSWORD   (database password, for db push over the pooler)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Dry run (what would change?)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
